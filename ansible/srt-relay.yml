---
- name: Setup SRT Relay Server
  hosts: tag_Video_stream_relay
  become: yes
  vars:
    srt_ports:
      - 40159
      - 40160
    srt_latency: 250
    srt_service_name: srt-relay

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install srt-tools package
      apt:
        name: srt-tools
        state: present
        
    - name: Verify srt-tools installation
      command: srt-live-transmit --version
      register: srt_version
      changed_when: false

    - name: Display SRT version
      debug:
        msg: "SRT version installed: {{ srt_version.stdout }}"

    - name: Create systemd service file for SRT relay
      template:
        src: srt-relay.service.j2
        dest: /etc/systemd/system/{{ srt_service_name }}.service
        mode: 0644
      notify: restart srt relay

    - name: Create script directory
      file:
        path: /usr/local/bin
        state: directory
        mode: 0755

    - name: Deploy SRT relay script
      template:
        src: srt-relay.sh.j2
        dest: /usr/local/bin/srt-relay.sh
        mode: 0755

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start SRT relay service
      systemd:
        name: "{{ srt_service_name }}"
        enabled: yes
        state: started

    - name: Check if service is running
      command: systemctl is-active {{ srt_service_name }}
      register: service_status
      changed_when: false
      failed_when: service_status.rc != 0

    - name: Display service status
      debug:
        msg: "SRT relay service is {{ service_status.stdout }}"

  handlers:
    - name: restart srt relay
      systemd:
        name: "{{ srt_service_name }}"
        state: restarted
        daemon_reload: yes